[project]
name = "gradescope-mcp"
version = "0.1.0"
description = "MCP server for Gradescope course management, grading, regrades, statistics, and AI-assisted workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.0",
    "gradescopeapi>=1.8.1",
    "mcp>=2.2.0,<3",
    "python-dotenv>=1.2.2",
    # Page downloads use HTTPResponse.read1 (2.2) and shutdown() (2.3); an
    # older urllib3 falls back to iter_content without the hard deadline.
    "urllib3>=2.3",
]

[project.scripts]
gradescope-mcp = "gradescope_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradescope_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0",
]
